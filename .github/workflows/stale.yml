name: Mark stale issues and PRs
on:
  schedule:
    - cron: '0 0 * * *'   # Daily

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            👋 This issue has been automatically marked as stale because it has
            had no recent activity. It will be closed in 14 days if no further
            activity occurs. Please comment or update if this is still relevant!
          close-issue-message: |
            ☕ Closing due to inactivity. Feel free to reopen if this comes up again!
          stale-pr-message: |
            👋 This PR has been automatically marked as stale after 30 days.
            Please update or close it. Thank you!
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,in-progress,help-wanted'


